<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="index.css" />
    <title>Todo List</title>
  </head>
  <body>
    <main class="todo-container">
      <h1>My todo list</h1>
      <p class="subtitle">Organize your day , one task at a time.</p>
      <div class="main">
        <input
          type="text"
          name="textbox"
          required
          placeholder="Add Todo"
          class="textbox inputTexted"
        />
        <button class="submit-button AddInput" id="add">Add</button>
      </div>
      <div class="task-list outputPage"></div>
    </main>
    <script src="index.js"></script>
  </body>
</html>
