<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="index.css" />
    <title>Todo List</title>
  </head>
  <body>
    <main class="todo-container">
      <h1>My todo list</h1>
      <p class="subtitle">Organize your day , one task at a time.</p>
      <div class="main">
        <input
          type="text"
          name="textbox"
          id="text"
          required
          placeholder="Add Todo"
          class="textbox"
        />
        <button class="submit-button">Add</button>
      </div>
      <div class="task-list">
        <ul class="task-list-ul">
          <li>
            <input type="checkbox" name="checkbox" id="checkbox" />boy whoa are
            you and what are you doing here
            <span class="track">completed</span>
            <button class="delete-been">&#128465;</button>
          </li>
        </ul>
      </div>
    </main>
  </body>
</html>
