<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#15253f" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Search</title>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <span class="brand-mark"
            ><img src="1.jpg" alt="Graduation cap"
          /></span>
          <span>Student Portal<span class="brand-dot">.</span></span>
        </div>

        <div class="profile-mini">
          <div class="avatar">
            <img
              src="download.jpg"
              alt="profile-picture"
              class="profile-image"
            />
          </div>
          <div><strong>Alex Morgan</strong><span>Computer Science</span></div>
          <button class="icon-button more" aria-label="Profile options">
            •••
          </button>
        </div>

        <nav class="main-nav" aria-label="Main navigation">
          <p class="nav-label">Workspace</p>
          <a class="nav-item" href="index.html"
            ><span class="nav-icon">⌂</span>Overview</a
          >
          <a class="nav-item" href="courses.html"
            ><span class="nav-icon">▦</span> Courses <b>6</b></a
          >
          <a class="nav-item" href="calendar.html"
            ><span class="nav-icon">□</span>Calendar</a
          >
          <a class="nav-item" href="grades.html"
            ><span class="nav-icon">↗</span>Grades</a
          >
          <a class="nav-item" href="time table.html"
            ><span class="nav-icon">⏱</span>Timetable</a
          >
          <p class="nav-label">Personal</p>
          <a class="nav-item" href="messages.html"
            ><span class="nav-icon">✉</span>Messages
            <b class="alert-count">3</b></a
          >
          <a class="nav-item" href="niti.html"
            ><span class="nav-icon">🔔</span>Notifications
            <b class="alert-count">3</b></a
          >
          <a class="nav-item" href="settings.html"
            ><span class="nav-icon">⚙</span>Settings</a
          >
        </nav>

        <div class="sidebar-bottom">
          <div class="help-card">
            <span class="help-icon">?</span>
            <strong>Need a hand?</strong>
            <small>Visit the student help center</small>
            <a href="help.html">Get support <span>↗</span></a>
          </div>
          <div class="semester-row">
            <span class="status-dot"></span><span>Spring 2025</span>
            <button class="icon-button">⌄</button>
          </div>
        </div>
      </aside>

      <main class="main-content" id="courses">
        <header class="topbar">
          <div class="first">
            <span>Student portal</span><i>/</i><strong>Courses</strong>
          </div>
          <div class="secound">
            <input
              type="search"
              name="searchbar"
              id="information"
              class="searchbar"
              placeholder="🔎Search for courses and grades"
            />
            <button class="search-button">Search</button>
          </div>

          <div class="top-actions">
            <div class="link-noti">
              <a
                class="icon-button"
                href="messages.html"
                aria-label="Notifications"
                >🔔 <span></span
              ></a>
            </div>
            <div class="noti">3</div>
          </div>

          <div class="top-action">
            <a class="top-avatar" href="profile.html" aria-label="Open profile">
              <img
                src="download.jpg"
                alt="profile-picture"
                class="profile-image"
              />
            </a>
            <span class="name">
              <strong>Alex Morgan</strong>
              <span>Log in</span>
            </span>
          </div>
        </header>

        <div class="page-content">
          <!-- keep existing page content here -->
        </div>
      </main>
    </div>

    <div class="toast" id="toast" role="status"></div>
  </body>
</html>
